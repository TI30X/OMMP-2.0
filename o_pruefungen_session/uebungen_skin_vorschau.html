<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMMP Übungen Skin Vorschau</title>
<link rel="stylesheet" href="css-ommp/ommp-uebungen-skin.css">
</head>
<body>
  <main class="ommp-exercise-shell">
    <div class="ommp-exercise-toolbar">
      <strong>OMMP Übungsmodul</strong>
      <span id="session-info">Übungsmodus · Klasse 10a · Lehrer X</span>
    </div>

    <div class="ommp-exercise-grid">
      <section class="ommp-exercise-card">
        <h1 class="ommp-task-title">Aufgabe 1: Terme vereinfachen</h1>
        <p>Vereinfache den Term und trage das Ergebnis ein.</p>
        <p><strong>3x + 5x - 2</strong></p>

        <form>
          <label for="antwort">Antwort</label><br>
          <input id="antwort" type="text" value="8x - 2">
          <input type="button" value="Prüfen">
          <input type="submit" value="Nächste Aufgabe">
        </form>

        <div class="ommp-answer-panel">
          <strong>Hinweis</strong>
          <p>Fasse zuerst gleiche Variablen zusammen.</p>
        </div>
      </section>

      <aside class="ommp-exercise-card">
        <h2>Navigation</h2>
        <p>Aufgabe 1 von 8</p>
        <button type="button">Lösung anzeigen</button>
        <button type="button">Zur Übersicht</button>
      </aside>
    </div>
  </main>
  <script>
    var params = new URLSearchParams(window.location.search);
    var mode = params.get("p_nr") === "0" ? "Übungsmodus" : "Prüfungsmodus";
    var klasse = params.get("klasse") || "";
    var zug = params.get("zug") || "";
    var teacher = params.get("teachername") || "Lehrer X";
    var school = params.get("kuerzel_schule") || "Übungsschule";
    var classText = klasse ? " · Klasse " + klasse + zug : "";

    document.getElementById("session-info").textContent = mode + classText + " · " + teacher + " · " + school;
  </script>
</body>
</html>
